# Builds the static export and publishes it to GitHub Pages.
#
# Pages serves files and runs nothing, so what gets published is the `out/`
# folder `next build` writes when NEXT_PUBLIC_BASE_PATH is set — see
# next.config.ts. Without that variable the same source still builds as an
# ordinary server-rendered app, which is what `npm run dev` does.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        # Where the site is served from decides the base path. A github.io
        # project page lives under /<repo> — read from the event rather than
        # written in, so a rename doesn't break the build. A custom domain
        # serves it at the root instead, and needs no prefix at all.
        #
        # To move to a domain: set the SITE_CUSTOM_DOMAIN repository variable
        # (Settings -> Secrets and variables -> Actions -> Variables) to the
        # domain, and set the same domain under Settings -> Pages. Unset, this
        # builds exactly as it always has.
        run: |
          if [ -n "${{ vars.SITE_CUSTOM_DOMAIN }}" ]; then
            echo "Building for https://${{ vars.SITE_CUSTOM_DOMAIN }}/ (no base path)"
            export NEXT_PUBLIC_BASE_PATH=""
            export NEXT_PUBLIC_SITE_URL="https://${{ vars.SITE_CUSTOM_DOMAIN }}"
          else
            echo "Building for a github.io project page under /${{ github.event.repository.name }}"
            export NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}"
            export NEXT_PUBLIC_SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          npm run build
        env:
          STATIC_EXPORT: '1'
          # Cross-device presence. Both are public values — the anon key is
          # meant to be shipped to browsers — so they are repository variables
          # rather than secrets. Unset, the build still succeeds and the room
          # falls back to presence across tabs of one browser.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Where the music is served from, when it has outgrown Pages. Set it
          # to the bucket's own origin — https://audio.example.com, no trailing
          # slash, files at the root — and that host must send CORS headers, or
          # iOS loses its sound. Unset, the tracks ship with the site as before.
          NEXT_PUBLIC_AUDIO_BASE_URL: ${{ vars.NEXT_PUBLIC_AUDIO_BASE_URL }}
          # Cloudflare Web Analytics. The beacon token is public by nature —
          # it identifies the site, not an account — so it is a variable like
          # the rest. Unset, the beacon is not on the page at all and nobody
          # is counted, which is what every local build and fork should get.
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
