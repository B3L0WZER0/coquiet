<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="coquiet">
  <!--
    The coquiet mark: an open C with a dot resting in its opening — a room with
    a way in, and someone already inside.

    Drawn rather than exported, so it stays sharp at every size a browser asks
    for and costs a few hundred bytes. Colours are the palette's own taupe and
    oat, so the tab matches the room.
  -->
  <circle cx="50" cy="50" r="50" fill="#a3927a" />
  <g fill="none" stroke="#e9e0cf" stroke-linecap="round">
    <path d="M68.3 36 A23.5 23.5 0 1 0 68.3 63" stroke-width="7.2" />
  </g>
  <circle cx="74.6" cy="49.5" r="4.9" fill="#e9e0cf" />
</svg>
